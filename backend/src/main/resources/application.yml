server:
  port: 8080

# 文件上传配置
upload:
  dir: E:/DevEnv/project/sales-system/uploads

spring:
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3308/sales_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: sales-system-jwt-secret-key-2024-very-long-and-secure
  expiration: 86400000  # 24小时

# 微信支付配置（需要替换为真实配置）
wechat:
  mch-id: your-mch-id
  api-key: your-api-key
  cert-path: classpath:cert/apiclient_cert.p12
  notify-url: https://your-domain.com/api/webhook/wechat

# 支付宝沙箱配置
alipay:
  app-id: sandbox  # 沙箱环境会覆盖
  private-key: ""  # 应用私钥（沙箱）
  alipay-public-key: ""  # 支付宝公钥（沙箱）
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://localhost:8080/api/alipay/notify
  return-url: http://localhost:3000/pay
  sign-type: RSA2
  sandbox: true

# 日志配置
logging:
  level:
    root: INFO
    com.sales: DEBUG
    com.sales.controller: DEBUG
    com.sales.service: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/sales-system.log
